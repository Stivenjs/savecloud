services:
  caddy:
    ports: !reset []
    volumes:
      - ./Caddyfile.cloudflare:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy_upstreams
      - tunnel_ingress

  savecloud-api:
    ports: !reset []

  minio:
    ports: !reset []

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: savecloud-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env to enable Cloudflare Tunnel}
    depends_on:
      caddy:
        condition: service_started
    networks:
      - tunnel_ingress
