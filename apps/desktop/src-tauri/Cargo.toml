[package]
name = "savecloud-desktop"
version = "1.24.2"
description = "Sync your game saves to the cloud. Auto-upload on change, local backups before overwrite. Works with Steam, non-Steam, and emulated games."
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "savecloud_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
dotenvy = "0.15"
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-ico", "macos-private-api", "devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
keyring = "2"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking", "stream", "cookies", "multipart", "gzip", "socks"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
scraper = "0.24"
urlencoding = "2"
futures-util = "0.3"
tauri-plugin-dialog = "2"
notify = "6"
notify-debouncer-mini = "0.4"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
sysinfo = "0.31"
base64 = "0.22"
bytes = "1"
rayon = "1"
tar = "0.4"
librqbit = "8.1.1"
tauri-plugin-single-instance = "2.4.0"
filetime = "0.2.27"
once_cell = "1"
mlua = { version = "0.11", features = ["luajit", "vendored", "serialize", "send"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio = { version = "1", features = ["sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7.18", features = ["io", "io-util"] }
walkdir = "2.5.0"
thiserror = "2.0.18"
moka = { version = "0.12", default-features = false, features = ["sync"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
aes = "0.8"
cbc = "0.1"
rand = "0.8"
rcgen = "0.12"
sha2 = "0.10"
blake3 = "1"
hex = "0.4"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }

tower-http = { version = "0.6", features = ["cors"] }
mdns-sd = "0.13"
gethostname = "0.5"
r2d2 = "0.8.10"
r2d2_sqlite = "0.33.0"
url = "2.5.8"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
tauri-plugin-os = "2.3.2"
zstd = { version = "0.13.3", features = ["zstdmt"] }
num_cpus = "1.17.0"
log = "0.4.29"
env_logger = "0.11"
which = "7"
rustpotter = "3"
cpal = "0.15"
opus = "0.3.0"
ringbuf = "0.4"
half = "=2.3.1"
aes-gcm = "0.10.3"
wtransport = "0.6"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.14.1"
tokio-rustls = "0.26"



[dev-dependencies]
tempfile = "3.10"

[target.'cfg(windows)'.dependencies]
file_icon_provider = "1.0.0"
png = "0.18.1"
gilrs = { version = "0.10", default-features = false, features = ["xinput"] }
rusty-xinput = "1.3"
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Win32_System_Threading"] }
wmi = "0.14"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
raw-window-handle = "0.6"


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(windows))'.dependencies]
gilrs = "0.10"
rdev = "0.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

