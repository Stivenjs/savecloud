<!doctype html>
<html lang="es" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet" />
    <link rel="icon" type="image/png" href="./src/assets/128x128.png" />
    <link rel="apple-touch-icon" href="/icon-128.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SaveCloud" />
    <meta name="application-name" content="SaveCloud" />
    <meta name="msapplication-TileColor" content="#0a0a0a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SaveCloud - Tu propia nube de guardados de videojuegos</title>
    <meta
      name="description"
      content="Servidor de guardado en la nube personal para videojuegos (S3 + Lambda) y aplicación para sincronizar partidas. 100% privado y open source." />
    <meta property="og:title" content="SaveCloud - Sincroniza tus partidas de videojuegos en tu propia nube" />
    <meta
      property="og:description"
      content="Servidor self-hosted en AWS S3 + Lambda para almacenar tus partidas con total privacidad y cliente torrent integrado con catálogo de Steam." />
    <meta property="og:image" content="./src/assets/128x128.png" />
    <meta name="twitter:card" content="summary" />
  </head>

  <body>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("savecloud-web-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored === "dark" || (!stored && prefersDark) || (stored === "system" && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
