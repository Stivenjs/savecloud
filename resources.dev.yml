Resources:
  # Bucket principal para saves en Desarrollo
  SavesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AccelerateConfiguration:
        AccelerationStatus: Suspended
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["Content-Type", "x-user-id", "x-api-key"]
            AllowedMethods: [GET, PUT, HEAD]
            AllowedOrigins: ["*"]
      LifecycleConfiguration:
        Rules:
          - Id: ExpireShareTokens7Days
            Status: Enabled
            Prefix: share-tokens/
            ExpirationInDays: 7

  # Tabla Efímera para WebSockets
  ActiveConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ${sls:stage}-ActiveConnections
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 1
            WriteCapacityUnits: 1
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
