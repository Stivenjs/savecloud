services:
  caddy:
    image: caddy:2-alpine
    container_name: savecloud-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  savecloud-api:
    image: savecloud-api:local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
    container_name: savecloud-api
    restart: unless-stopped
    # Loopback access preserves the local development URL without exposing the API publicly.
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - LOG_LEVEL=${LOG_LEVEL:-warn}
      - HTTP_REQUEST_LOGS=${HTTP_REQUEST_LOGS:-false}
      - API_KEY=${SYNC_GAMES_API_KEY:?SYNC_GAMES_API_KEY must be set to a unique random secret}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET must be set to a separate random secret}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      - BUCKET_NAME=savecloud-saves
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
      - DATABASE_URL=${DATABASE_URL:-}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER:-savecloud}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?Define DATABASE_PASSWORD in .env}
      - DATABASE_NAME=${DATABASE_NAME:-savecloud}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-10}
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      - S3_FORCE_PATH_STYLE=true
      - SQS_ENDPOINT=http://elasticmq:9324
      - S3_EVENT_QUEUE_NAME=savecloud-s3-events
      - S3_EVENT_QUEUE_URL=http://elasticmq:9324/000000000000/savecloud-s3-events
    depends_on:
      minio:
        condition: service_started
      elasticmq:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - 'fetch("http://127.0.0.1:3000/health").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  steam-seed-worker:
    extends:
      service: savecloud-api
    container_name: savecloud-steam-seed-worker
    command: ["bun", "dist/steam-seed-worker.js"]
    ports: !reset []
    healthcheck:
      disable: true
    depends_on:
      create-bucket:
        condition: service_completed_successfully
    environment:
      - SEED_INTERVAL_MS=${SEED_INTERVAL_MS:-120000}

  s3-events-worker:
    extends:
      service: savecloud-api
    container_name: savecloud-s3-events-worker
    command: ["bun", "dist/s3-events-worker.js"]
    ports: !reset []
    healthcheck:
      disable: true
    depends_on:
      elasticmq:
        condition: service_started
      savecloud-api:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

  member-purge-worker:
    extends:
      service: savecloud-api
    container_name: savecloud-member-purge-worker
    command: ["bun", "dist/member-purge-worker.js"]
    ports: !reset []
    healthcheck:
      disable: true
    depends_on:
      savecloud-api:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    environment:
      - MEMBER_PURGE_INTERVAL_MS=${MEMBER_PURGE_INTERVAL_MS:-3600000}

  notifications-expiration-worker:
    extends:
      service: savecloud-api
    container_name: savecloud-notifications-expiration-worker
    command: ["bun", "dist/notification-expiration-worker.js"]
    ports: !reset []
    healthcheck:
      disable: true
    depends_on:
      savecloud-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - NOTIFICATIONS_EXPIRATION_INTERVAL_MS=${NOTIFICATIONS_EXPIRATION_INTERVAL_MS:-21600000}

  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: savecloud-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000" # Endpoint S3 local; en VPS el acceso externo pasa por Caddy.
      - "127.0.0.1:9001:9001" # Panel de administración solo local.
    environment:
      - MINIO_ROOT_USER=${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
      - MINIO_NOTIFY_WEBHOOK_ENABLE_primary=on
      - MINIO_NOTIFY_WEBHOOK_ENDPOINT_primary=http://savecloud-api:3000/webhooks/minio
      - MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_primary=${SYNC_GAMES_API_KEY}
      - MINIO_NOTIFY_WEBHOOK_QUEUE_DIR_primary=/mnt/data/.minio-events
      - MINIO_NOTIFY_WEBHOOK_QUEUE_LIMIT_primary=100000
    command: server /mnt/data --console-address ":9001" --license /minio.license
    volumes:
      - minio_data:/mnt/data
      - ${MINIO_LICENSE_PATH:?Define MINIO_LICENSE_PATH en .env con la ruta al archivo de licencia AIStor}:/minio.license:ro

  create-bucket:
    image: savecloud-api:local
    container_name: savecloud-storage-bootstrap
    command: ["bun", "dist/storage-bootstrap.js"]
    restart: on-failure
    environment:
      - BUCKET_NAME=savecloud-saves
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
      - S3_ENDPOINT=http://minio:9000
      - S3_FORCE_PATH_STYLE=true
    depends_on:
      minio:
        condition: service_started
      savecloud-api:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    container_name: savecloud-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DATABASE_USER:-savecloud}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:?Define DATABASE_PASSWORD in .env}
      - POSTGRES_DB=${DATABASE_NAME:-savecloud}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    container_name: savecloud-elasticmq
    restart: unless-stopped
    volumes:
      - ./infra/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
      - elasticmq_data:/data

volumes:
  caddy_data:
  caddy_config:
  minio_data:
  postgres_data:
  elasticmq_data:
