services:
  savecloud-api:
    image: savecloud-api:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: savecloud-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - SYNC_GAMES_API_KEY=${SYNC_GAMES_API_KEY:-sg_secret_key_12345}
      - BUCKET_NAME=savecloud-saves
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      - S3_FORCE_PATH_STYLE=true
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - GAME_STATS_TABLE=savecloud-game-stats
      - SAVE_FILES_INDEX_TABLE=savecloud-save-files-index
      - CONNECTIONS_TABLE=savecloud-connections
    depends_on:
      minio:
        condition: service_started
      dynamodb-local:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - 'fetch("http://127.0.0.1:3000/health").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  steam-seed-worker:
    extends:
      service: savecloud-api
    container_name: savecloud-steam-seed-worker
    command: ["bun", "dist/steam-seed-worker.js"]
    ports: !reset []
    depends_on:
      create-bucket:
        condition: service_completed_successfully
    environment:
      - SEED_INTERVAL_MS=${SEED_INTERVAL_MS:-300000}

  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: savecloud-minio
    restart: unless-stopped
    ports:
      - "9000:9000" # Puerto de API S3
      - "9001:9001" # Panel de administración Web (http://localhost:9001)
    environment:
      - MINIO_ROOT_USER=${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
      - MINIO_NOTIFY_WEBHOOK_ENABLE_primary=on
      - MINIO_NOTIFY_WEBHOOK_ENDPOINT_primary=http://savecloud-api:3000/webhooks/minio
    command: server /mnt/data --console-address ":9001" --license /minio.license
    volumes:
      - minio_data:/mnt/data
      - ${MINIO_LICENSE_PATH:?Define MINIO_LICENSE_PATH en .env con la ruta al archivo de licencia AIStor}:/minio.license:ro

  create-bucket:
    image: savecloud-api:local
    container_name: savecloud-storage-bootstrap
    command: ["bun", "dist/storage-bootstrap.js"]
    restart: on-failure
    environment:
      - BUCKET_NAME=savecloud-saves
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
      - S3_ENDPOINT=http://minio:9000
      - S3_FORCE_PATH_STYLE=true
    depends_on:
      minio:
        condition: service_started
      savecloud-api:
        condition: service_healthy

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: savecloud-dynamodb
    restart: unless-stopped
    user: root
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    ports:
      - "8000:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

volumes:
  minio_data:
  dynamodb_data:
