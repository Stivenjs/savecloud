Resources:
  # Bucket principal para saves en Desarrollo
  SavesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AccelerateConfiguration:
        AccelerationStatus: Suspended
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["Content-Type", "x-user-id", "x-api-key"]
            AllowedMethods: [GET, PUT, HEAD]
            AllowedOrigins: ["*"]
      LifecycleConfiguration:
        Rules:
          - Id: ExpireShareTokens7Days
            Status: Enabled
            Prefix: share-tokens/
            ExpirationInDays: 7
          - Id: ExpirePendingCloudInvites30Days
            Status: Enabled
            Prefix: cloud-invites/
            ExpirationInDays: 30
          - Id: ExpireNotifications30Days
            Status: Enabled
            Prefix: notifications/
            ExpirationInDays: 30
          - Id: ExpireOldGameInventory90Days
            Status: Enabled
            Prefix: game-inventory/
            ExpirationInDays: 90

  # Tabla Efímera para WebSockets
  ActiveConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ${sls:stage}-ActiveConnections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  GameStatsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ${sls:stage}-GameStats
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: gameId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: gameId
          KeyType: RANGE

  SaveFilesIndexTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ${sls:stage}-SaveFilesIndex
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: objectKey
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: objectKey
          KeyType: RANGE
