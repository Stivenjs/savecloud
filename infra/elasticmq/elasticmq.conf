include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = relaxed
}

generate-node-address = false

aws {
  region = us-east-1
  accountId = 000000000000
}

auto-create-queues {
  enabled = true
  template {
    defaultVisibilityTimeout = 300 seconds
    receiveMessageWait = 20 seconds
  }
}

messages-storage {
  enabled = true
  uri = "jdbc:h2:/data/elasticmq"
}
