Resources:
  # Transfer Acceleration: subidas/descargas más rápidas vía edge de CloudFront.
  # Tras el deploy puede tardar ~20 min en activarse. Coste extra por transferencia (ver S3 pricing).
  SavesBucket:
    Type: AWS::S3::Bucket
    Properties:
      AccelerateConfiguration:
        AccelerationStatus: Suspended
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["Content-Type", "x-user-id", "x-api-key"]
            AllowedMethods: [GET, PUT, HEAD]
            AllowedOrigins: ["*"]
      LifecycleConfiguration:
        Rules:
          - Id: ExpireShareTokens7Days
            Status: Enabled
            Prefix: share-tokens/
            ExpirationInDays: 7
          - Id: ExpireCloudInvites7Days
            Status: Enabled
            Prefix: cloud-invites/
            ExpirationInDays: 7

  CloudFrontOriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment:
          Fn::Sub: "Access identity for CloudFront to reach ${SavesBucket}"

  SavesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: { Ref: SavesBucket }
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontAccess
            Effect: Allow
            Principal:
              CanonicalUser:
                Fn::GetAtt:
                  - CloudFrontOriginAccessIdentity
                  - S3CanonicalUserId
            Action: "s3:GetObject"
            Resource:
              - Fn::Sub: "arn:aws:s3:::${SavesBucket}/*/backups/*"

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment:
          Fn::Sub: "CloudFront distribution for SaveCloud - ${sls:stage, 'dev'}"
        DefaultRootObject: ""
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: SavesBucketOrigin
            DomainName:
              Fn::GetAtt:
                - SavesBucket
                - RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity:
                Fn::Sub: "origin-access-identity/cloudfront/${CloudFrontOriginAccessIdentity}"
        DefaultCacheBehavior:
          TargetOriginId: SavesBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN:
                Fn::GetAtt:
                  - CloudFrontAllowBackupsOnlyFunction
                  - FunctionARN
          Compress: true
          MinTTL: 31536000
          DefaultTTL: 31536000
          MaxTTL: 31536000
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  CloudFrontAllowBackupsOnlyFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name:
        Fn::Sub: "savecloud-allow-backups-only-${sls:stage, 'dev'}"
      AutoPublish: true
      FunctionConfig:
        Comment: "Block all CloudFront paths except */backups/*"
        Runtime: cloudfront-js-1.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri || "";
          if (uri.indexOf("/backups/") !== -1) {
            return request;
          }

          return {
            statusCode: 403,
            statusDescription: "Forbidden",
            headers: {
              "cache-control": { value: "no-store" },
              "content-type": { value: "text/plain; charset=utf-8" }
            },
            body: "Forbidden"
          };
        }

Outputs:
  CloudFrontDistributionDomainName:
    Description: CloudFront domain for backup downloads
    Value:
      Fn::GetAtt:
        - CloudFrontDistribution
        - DomainName
  CloudFrontDistributionUrl:
    Description: CloudFront URL for backup downloads
    Value:
      Fn::Join:
        - ""
        - - "https://"
          - Fn::GetAtt:
              - CloudFrontDistribution
              - DomainName
