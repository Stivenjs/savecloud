Resources:
  # Bucket principal para saves en Producción
  SavesBucket:
    Type: AWS::S3::Bucket
    Properties:
      AccelerateConfiguration:
        AccelerationStatus: Suspended
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["Content-Type", "x-user-id", "x-api-key"]
            AllowedMethods: [GET, PUT, HEAD]
            AllowedOrigins: ["*"]
      LifecycleConfiguration:
        Rules:
          - Id: ExpireShareTokens7Days
            Status: Enabled
            Prefix: share-tokens/
            ExpirationInDays: 7

  CloudFrontOriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment:
          Fn::Sub: "Access identity for CloudFront to reach ${SavesBucket}"

  SavesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: { Ref: SavesBucket }
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontAccess
            Effect: Allow
            Principal:
              CanonicalUser:
                Fn::GetAtt: [CloudFrontOriginAccessIdentity, S3CanonicalUserId]
            Action: "s3:GetObject"
            Resource:
              Fn::Sub: "arn:aws:s3:::${SavesBucket}/*"

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: "CloudFront Distribution para SaveCloud (${sls:stage})"
        Enabled: true
        HttpVersion: http3
        Origins:
          - Id: S3Origin
            DomainName:
              Fn::GetAtt: [SavesBucket, RegionalDomainName]
            S3OriginConfig:
              OriginAccessIdentity:
                Fn::Join: ["", ["origin-access-identity/cloudfront/", Ref: CloudFrontOriginAccessIdentity]]
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          DefaultTTL: 31536000
          MaxTTL: 31536000
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN:
                Fn::GetAtt: [CloudFrontAllowBackupsOnlyFunction, FunctionARN]
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Name
          Value: "savecloud-distro-${sls:stage}"

  CloudFrontAllowBackupsOnlyFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name:
        Fn::Sub: "savecloud-allow-backups-only-${sls:stage, 'dev'}"
      AutoPublish: true
      FunctionConfig:
        Comment: "Block all CloudFront paths except */backups/*"
        Runtime: cloudfront-js-1.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri || "";
          if (uri.indexOf("/backups/") !== -1) {
            return request;
          }

          return {
            statusCode: 403,
            statusDescription: "Forbidden",
            headers: {
              "cache-control": { value: "no-store" },
              "content-type": { value: "text/plain; charset=utf-8" }
            },
            body: "Forbidden"
          };
        }

  # Tabla Efímera para WebSockets
  ActiveConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ${sls:stage}-ActiveConnections
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 1
            WriteCapacityUnits: 1
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

Outputs:
  CloudFrontDistributionDomainName:
    Description: CloudFront domain for backup downloads
    Value:
      Fn::GetAtt:
        - CloudFrontDistribution
        - DomainName
  CloudFrontDistributionUrl:
    Description: CloudFront URL for backup downloads
    Value:
      Fn::Join:
        - ""
        - - "https://"
          - Fn::GetAtt:
              - CloudFrontDistribution
              - DomainName
