service: sync-games

frameworkVersion: "4"

# Stage = entorno separado: cada uno tiene su propio stack (API Gateway, Lambda, S3 bucket).
# deploy --stage dev  → stack sync-games-dev, bucket y API de desarrollo.
# deploy --stage live → stack sync-games-live, bucket y API de producción.

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-2
  stage: ${opt:stage, 'dev'}
  environment:
    BUCKET_NAME: { Ref: SavesBucket }
    API_KEY: ${env:SYNC_GAMES_API_KEY, ''}
    DOWNLOAD_BASE_URL: ${self:custom.downloadBaseUrl.${sls:stage}, ''}
  httpApi:
    authorizers:
      apiKeyAuthorizer:
        type: request
        functionName: apiAuthorizer
        enableSimpleResponses: true
        resultTtlInSeconds: 0
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            - s3:ListBucket
            - s3:CreateMultipartUpload
            - s3:AbortMultipartUpload
            - s3:CompleteMultipartUpload
            - s3:ListMultipartUploadParts
          Resource:
            - Fn::Sub: "arn:aws:s3:::${SavesBucket}"
            - Fn::Sub: "arn:aws:s3:::${SavesBucket}/*"

build:
  esbuild:
    bundle: true
    sourcemap: true
    target: node22

custom:
  downloadBaseUrl:
    dev: ""
    live:
      Fn::Join:
        - ""
        - - "https://"
          - Fn::GetAtt: [CloudFrontDistribution, DomainName]
  # Seed Steam: dev sin schedule por defecto; live con regla barata (ajustar rate si hace falta).
  steamSeedScheduleEnabled:
    dev: false
    live: true
  steamSeedScheduleRate:
    dev: rate(24 hours)
    live: rate(5 minutes)
  # Valor por defecto de filtros appdetails.
  steamSeedFiltersDefault: "basic,developers,publishers,genres,categories,release_date,screenshots,movies"

functions:
  apiAuthorizer:
    handler: src/interfaces/lambda/authorizer.handler
    description: Autorizador por API key para savecloud - entorno ${sls:stage, 'dev'}
    environment:
      API_KEY: ${env:SYNC_GAMES_API_KEY, ''}
  api:
    handler: src/interfaces/lambda/handler.handler
    description: API de guardados en la nube (savecloud) - entorno ${sls:stage, 'dev'}
    timeout: 60
    events:
      - httpApi:
          path: /{proxy+}
          method: ANY
          authorizer:
            name: apiKeyAuthorizer
      - httpApi:
          path: /
          method: ANY
          authorizer:
            name: apiKeyAuthorizer

  steamSeedWorker:
    handler: src/interfaces/lambda/steam-seed/handler.handler
    description: Seed incremental Steam appdetails (S3 + EventBridge) - ${sls:stage, 'dev'}
    timeout: 900
    memorySize: 256
    reservedConcurrency: 1
    environment:
      STEAM_SEED_PREFIX: steam-seed
      STEAM_DELAY_MS: "2000"
      STEAM_BATCH_SIZE: "8"
      STEAM_BACKOFF_MINUTES: "30"
      STEAM_LANG: spanish
      STEAM_FILTERS: ${env:STEAM_FILTERS, self:custom.steamSeedFiltersDefault}
    events:
      - schedule:
          rate: ${self:custom.steamSeedScheduleRate.${sls:stage}, 'rate(15 minutes)'}
          enabled: ${self:custom.steamSeedScheduleEnabled.${sls:stage}, false}

resources: ${file(./resources.${sls:stage}.yml)}
